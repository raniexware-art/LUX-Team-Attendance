<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>LUX Decibels Team Attendance</title>
    <link rel="icon" type="image/png" href="/logowhit.png?v=2">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="LUX Decibels Team Attendance home">
          <img class="brand-logo" src="/lux-decibels-logo.png" alt="">
        </a>
      </header>

      <section id="auth-view" class="auth-layout">
        <div class="welcome-panel">
          <span class="eyebrow">YOUR WORKDAY, IN SYNC</span>
          <h1>A better way to keep track of your day.</h1>
          <p>One simple place to manage your team and record attendance.</p>
          <div class="welcome-art" aria-hidden="true">
            <div class="art-card art-card-back"></div>
            <div class="art-card art-card-front">
              <span class="art-check">✓</span>
              <span class="art-lines"><i></i><i></i></span>
              <span class="art-pill">Checked in</span>
            </div>
            <span class="art-sparkle sparkle-one">✦</span>
            <span class="art-sparkle sparkle-two">✳ </span>
          </div>
          <span class="welcome-foot">Clear records. Smoother days.</span>
        </div>

        <div class="form-panel">
          <div id="auth-form-container"></div>
        </div>
      </section>

      <section id="app-view" class="app-view hidden">
        <header class="dashboard-heading">
          <div>
            <span class="eyebrow" id="dashboard-eyebrow"></span>
            <h1 id="dashboard-title"></h1>
            <p id="dashboard-subtitle"></p>
          </div>
          <button class="button button-quiet" id="logout-button" type="button">Sign out <span aria-hidden="true">↗</span></button>
        </header>
        <div id="dashboard-content"></div>
      </section>
      <footer class="footer">LUXDecibels <span>·</span> Keep your day moving</footer>
    </main>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div class="whatsapp-notification hidden" id="attendance-notification" role="status" aria-live="polite">
      <span class="whatsapp-notification-icon" aria-hidden="true">✓</span>
      <div class="whatsapp-notification-content">
        <strong id="attendance-notification-title"></strong>
        <p id="attendance-notification-message"></p>
        <time id="attendance-notification-time"></time>
        <button class="whatsapp-notification-action hidden" id="attendance-reminder-action" type="button">Check in now</button>
      </div>
      <button class="whatsapp-notification-close" id="attendance-notification-close" type="button" aria-label="Dismiss notification">×</button>
    </div>
    <dialog class="late-checkin-dialog" id="late-checkin-dialog" aria-labelledby="late-checkin-title">
      <header class="late-checkin-header">
        <span aria-hidden="true">◷</span>
        <h2 id="late-checkin-title">Late Check-In</h2>
        <button class="late-checkin-close" id="late-checkin-close" type="button" aria-label="Close">×</button>
      </header>
      <form class="late-checkin-content" id="late-checkin-form">
        <p class="late-checkin-message">You are checking in <strong>late!</strong></p>
        <p class="late-checkin-time">Current Time: <strong id="late-checkin-current-time"></strong></p>
        <p class="late-checkin-time">Scheduled Time: <span id="late-checkin-scheduled-time"></span></p>
        <div class="late-checkin-reason">
          <label for="late-checkin-reason">Reason for Late Check-In <span aria-hidden="true">*</span></label>
          <input id="late-checkin-reason" name="reason" required maxlength="500" placeholder="Enter reason...">
        </div>
        <p class="late-checkin-error" id="late-checkin-error" role="alert"></p>
        <div class="late-checkin-actions">
          <button class="button late-checkin-cancel" id="late-checkin-cancel" type="button">Cancel</button>
          <button class="button late-checkin-submit" id="late-checkin-submit" type="submit">✓ <span>Submit</span></button>
        </div>
      </form>
    </dialog>
  </body>
</html>
