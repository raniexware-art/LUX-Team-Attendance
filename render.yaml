services:
  - type: web
    name: lux-decibels-attendance
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
